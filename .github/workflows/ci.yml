---
name: ci
"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v2
      - run: just check
        env:
          CHECK_ALL: "1"

  full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notid
          POSTGRES_PASSWORD: notid
          POSTGRES_DB: notid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notid"
          --health-interval 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: >-
        postgres://notid:notid@localhost:5432/notid_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v2
      - run: just test
