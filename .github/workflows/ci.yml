---
name: ci
"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notid
          POSTGRES_PASSWORD: notid
          POSTGRES_DB: notid_test
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U notid"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761
        with:
          sqlc-version: "1.25.0"
      - run: just check
        env:
          CHECK_ALL: "1"

  full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notid
          POSTGRES_PASSWORD: notid
          POSTGRES_DB: notid_test
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U notid"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - run: just test
